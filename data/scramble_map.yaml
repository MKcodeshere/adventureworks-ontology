    columns:
      wrk_id: workorderid
      prd_id: productid
      qty: orderqty
      scrap_qty: scrappedqty
      start_dt: startdate
      end_dt: enddate
      due_dt: duedate
      scrap_rsn_id: scrapreasonid
  wh.doc_mstr:
    source: production.document
    columns:
      doc_title: title
      owner_id: owner
      file_nm: filename
      stat_cd: status
      summary_txt: documentsummary
  wh.pers_mstr:
    source: person.person
    columns:
      pers_id: businessentityid
      pers_typ: persontype
      first_nm: firstname
      last_nm: lastname
      mid_nm: middlename
      title_cd: title
      email_promo: emailpromotion
  wh.emp_mstr:
    source: humanresources.employee
    columns:
      emp_id: businessentityid
      job_title: jobtitle
      hire_dt: hiredate
      gndr_cd: gender
      mar_cd: maritalstatus
      sal_flg: salariedflag
      cur_flg: currentflag
      vac_hrs: vacationhours
      sick_hrs: sickleavehours
      login_id: loginid
      natl_id: nationalidnumber
      birth_dt: birthdate
  wh.dept_mstr:
    source: humanresources.department
    columns:
      dept_id: departmentid
      dept_nm: name
      grp_nm: groupname
  wh.emp_dept_hist:
    source: humanresources.employeedepartmenthistory
    columns:
      emp_id: businessentityid
      dept_id: departmentid
      shift_id: shiftid
      start_dt: startdate
      end_dt: enddate
  wh.addr_mstr:
    source: person.address
    columns:
      addr_id: addressid
      line1: addressline1
      line2: addressline2
      city_nm: city
      st_id: stateprovinceid
      zip_cd: postalcode
  wh.be_addr:
    source: person.businessentityaddress
    columns:
      be_id: businessentityid
      addr_id: addressid
      addr_typ_id: addresstypeid
  wh.st_prov:
    source: person.stateprovince
    columns:
      st_id: stateprovinceid
      st_cd: stateprovincecode
      ctry_cd: countryregioncode
      st_nm: name
      terr_id: territoryid
  wh.ctry_rgn:
    source: person.countryregion
    columns:
      ctry_cd: countryregioncode
      ctry_nm: name
  wh.vnd_mstr:
    source: purchasing.vendor
    columns:
      vnd_id: businessentityid
      vnd_nm: name
      acct_no: accountnumber
      cred_rtg: creditrating
      pref_flg: preferredvendorstatus
      act_flg: activeflag
  wh.po_hdr:
    source: purchasing.purchaseorderheader
    columns:
      po_id: purchaseorderid
      stat_cd: status
      emp_id: employeeid
      vnd_id: vendorid
      ord_dt: orderdate
      ship_dt: shipdate
      sub_amt: subtotal
      tax_amt: taxamt
      frt_amt: freight
      net_amt: (subtotal+taxamt+freight)
      ship_mthd_id: shipmethodid
  wh.po_dtl:
    source: purchasing.purchaseorderdetail
    columns:
      po_id: purchaseorderid
      dtl_id: purchaseorderdetailid
      prd_id: productid
      qty: orderqty
      unit_prc: unitprice
      rcv_qty: receivedqty
      rej_qty: rejectedqty
      due_dt: duedate
  wh.cult_dim:
    source: production.culture
    columns:
      cult_cd: cultureid
      cult_nm: name
  wh.ship_mthd:
    source: purchasing.shipmethod
    columns:
      ship_mthd_id: shipmethodid
      ship_nm: name
      base_amt: shipbase
      rate_amt: shiprate
